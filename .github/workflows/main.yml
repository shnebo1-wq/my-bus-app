name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        shell: bash
        run: |
          # ხელახალი მცდელობა თუ apt ჩაიშალა (აგვარებს 100-ე ერორს)
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev libffi-dev libtool automake autoconf pkg-config unzip
          
          # ბიბლიოთეკების ინსტალაცია
          pip install --user --upgrade buildozer Cython==0.29.33 virtualenv

      - name: Build with Buildozer
        shell: bash
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # ვასუფთავებთ გარემოს
          buildozer android clean
          # ვიყენებთ --requirements-ს რომ ფორსირებულად დააყენოს
          yes | buildozer -v android debug
        
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Control-Center-Pro
          path: bin/*.apk
